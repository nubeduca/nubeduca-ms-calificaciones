# ms-calificaciones: libro de notas y publicación ordenada (EVA-02) y auditoría inmutable de notas (DAT-01).
# Contrato: nubeduca-contratos/apis/ms-calificaciones.openapi.yaml · source de eventos: lms.grading
#
# Parámetros (serverless deploy --stage dev --param="outbox=pipe"):
#   busName   bus de EventBridge. Si no se pasa, se lee del SSM /nubeduca/<stage>/bus-name
#             (lms-<stage>, de infra/base); si no existe, usa 'lms'.
#   outbox    pipe (por defecto, ADR-008) | lambda (relay, vuelta atrás). Cómo viaja el outbox del Stream al bus.
#   authMode  mock (por defecto, hasta AUTH-01) | cognito.
#   notasTopic  tópico SNS FIFO de notas publicadas (por defecto nubeduca-<stage>-notas.fifo, de
#             infra/bus en nubeduca-backend). Con el nombre viejo: --param="notasTopic=dev-notas.fifo"
#
# Sin `org:` fija: Serverless v4 toma la org de SERVERLESS_ACCESS_KEY (o de `serverless login`),
# así el mismo archivo se despliega en la cuenta de cualquier integrante.
service: nubeduca-ms-calificaciones

params:
  default:
    outbox: pipe
    authMode: mock

custom:
  busName: ${param:busName, ssm:/nubeduca/${sls:stage}/bus-name, 'lms'}
  relayEncendido:
    lambda: true
    pipe: false
  tablaAuditoria: ${sls:stage}-t_calificaciones_auditoria
  notasTopic: ${param:notasTopic, 'nubeduca-${sls:stage}-notas.fifo'}
  # DAT-01: en prod la tabla de auditoría no se puede borrar ni con `serverless remove`.
  protegerAuditoria:
    prod: true

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole   # Learner Lab no deja crear roles
  # PLT-06: trazas de API Gateway y Lambda en X-Ray.
  tracing:
    apiGateway: true
    lambda: true
  environment:
    SERVICIO: ms-calificaciones
    EVENT_SOURCE: lms.grading
    TABLA: ${sls:stage}-t_calificaciones
    TABLA_AUDITORIA: ${self:custom.tablaAuditoria}
    EVENT_BUS: ${self:custom.busName}
    AUTH_MODE: ${param:authMode}

package:
  patterns:
    - '!tests/**'
    - '!scripts/**'
    - '!.venv/**'
    - '!requirements-dev.txt'

functions:
  salud:
    handler: api/salud.lambda_handler
    events:
      - http: { path: /health, method: get, cors: true }

  # DAT-01. Con AUTH-01 listo, agrega a cada ruta:
  #   authorizer: { type: COGNITO_USER_POOLS, arn: ${param:userPoolArn} }
  historial:
    handler: api/historial.lambda_handler
    events:
      - http: { path: '/grades/{gradeId}/history', method: get, cors: true }

  # EVA-02. Con AUTH-01 listo, agrega el mismo authorizer que en historial.
  libro:
    handler: api/libro.lambda_handler
    events:
      - http: { path: '/courses/{courseId}/gradebook', method: get, cors: true }
      - http: { path: '/courses/{courseId}/grades/me', method: get, cors: true }

  notas:
    handler: api/notas.lambda_handler
    events:
      - http: { path: '/grade-items/{gradeItemId}/post', method: post, cors: true }
      - http: { path: '/grades/{gradeId}', method: patch, cors: true }

  # EVA-02. assignment.published -> columna del libro de notas.
  consumidorColumnas:
    handler: consumidores/columnas.lambda_handler
    events:
      - sqs:
          arn: !GetAtt ColaColumnas.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  # EVA-02. submission.graded -> nota en DRAFT + grade.changed por el outbox.
  consumidorNotas:
    handler: consumidores/notas.lambda_handler
    events:
      - sqs:
          arn: !GetAtt ColaNotas.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  # DAT-01. Registra cada grade.changed en la tabla de auditoría (solo agregar).
  auditoria:
    handler: consumidores/auditoria.lambda_handler
    events:
      - sqs:
          arn: !GetAtt ColaAuditoria.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  # De ms-cursos: enrollment.created/dropped (quién es TEACHER o STUDENT del curso).
  consumidor:
    handler: consumidores/matriculas.lambda_handler
    events:
      - sqs:
          arn: !GetAtt ColaEventos.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  # Relay outbox -> bus, solo con outbox=lambda (vuelta atrás de ADR-008). Lee el Stream y publica los EVENTO#.
  relayOutbox:
    handler: relay/stream_a_bus.lambda_handler
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt Tabla.StreamArn
          enabled: ${self:custom.relayEncendido.${param:outbox}}
          startingPosition: LATEST
          batchSize: 10
          maximumRetryAttempts: 10
          filterPatterns:
            - eventName: [INSERT]
              dynamodb:
                Keys:
                  sk:
                    S: [{ prefix: 'EVENTO#' }]

  # EVA-02. grade.posted del outbox -> SNS FIFO, en orden (MessageGroupId = <tenantId>:<courseId>).
  # Siempre encendido (el Pipe solo llega al bus). Sin bisect ni paralelismo: reintenta en orden.
  relayNotas:
    handler: relay/stream_a_sns.lambda_handler
    environment:
      TOPIC_NOTAS: arn:aws:sns:${aws:region}:${aws:accountId}:${self:custom.notasTopic}
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt Tabla.StreamArn
          startingPosition: LATEST
          batchSize: 10
          parallelizationFactor: 1
          bisectBatchOnFunctionError: false
          maximumRetryAttempts: 10
          filterPatterns:
            - eventName: [INSERT]
              dynamodb:
                Keys:
                  sk:
                    S: [{ prefix: 'EVENTO#' }]
                NewImage:
                  detailType:
                    S: [lms.grading.grade.posted.v1]

resources:
  Conditions:
    UsarPipe: !Equals ['${param:outbox}', 'pipe']

  Resources:
    # Tabla principal: PK tenant_id + sk. Libro de notas (EVA-02). El Stream alimenta el outbox
    # (relayOutbox o el Pipe -> bus) y relayNotas (grade.posted -> SNS FIFO).
    Tabla:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${sls:stage}-t_calificaciones
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: tenant_id, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: tenant_id, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # DAT-01: auditoría de notas. Solo se agregan registros:
    # - la política de recurso niega editar o borrar ítems a CUALQUIER principal (LabRole incluido);
    # - el código solo hace PutItem con attribute_not_exists(sk);
    # - sin TTL (nada expira) y con PITR para recuperar la tabla si alguien la borra.
    TablaAuditoria:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablaAuditoria}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: tenant_id, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: tenant_id, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        DeletionProtectionEnabled: ${self:custom.protegerAuditoria.${sls:stage}, false}
        ResourcePolicy:
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AuditoriaSoloAgregar
                Effect: Deny
                Principal: '*'
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:PartiQLUpdate
                  - dynamodb:PartiQLDelete
                Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.tablaAuditoria}

    # Outbox con EventBridge Pipes (outbox=pipe, por defecto desde ADR-008). El LabRole lo permite (GATE-0).
    PipeOutbox:
      Type: AWS::Pipes::Pipe
      Condition: UsarPipe
      Properties:
        Name: ${self:service}-${sls:stage}-outbox
        RoleArn: arn:aws:iam::${aws:accountId}:role/LabRole
        Source: !GetAtt Tabla.StreamArn
        SourceParameters:
          DynamoDBStreamParameters:
            StartingPosition: LATEST
            BatchSize: 1
            MaximumRetryAttempts: 10
          FilterCriteria:
            Filters:
              - Pattern: '{"eventName":["INSERT"],"dynamodb":{"Keys":{"sk":{"S":[{"prefix":"EVENTO#"}]}}}}'
        Target: arn:aws:events:${aws:region}:${aws:accountId}:event-bus/${self:custom.busName}
        TargetParameters:
          InputTemplate: '<$.dynamodb.NewImage.detail.S>'
          EventBridgeEventBusParameters:
            Source: '$.dynamodb.NewImage.source.S'
            DetailType: '$.dynamodb.NewImage.detailType.S'

    # --- Consumidor de ms-cursos: regla -> cola -> Lambda (DLQ tras 5 intentos) --------
    ColaEventosDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-calificaciones-eventos-dlq
        MessageRetentionPeriod: 1209600

    ColaEventos:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-calificaciones-eventos
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaEventosDLQ.Arn
          maxReceiveCount: 5

    ReglaConsumidor:
      Type: AWS::Events::Rule
      Properties:
        Name: nubeduca-${sls:stage}-calificaciones
        EventBusName: ${self:custom.busName}
        EventPattern:
          source: [lms.courses]
          detail-type: [lms.courses.enrollment.created.v1, lms.courses.enrollment.dropped.v1]
        Targets:
          - Id: cola-calificaciones
            Arn: !GetAtt ColaEventos.Arn

    PoliticaColaEventos:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref ColaEventos]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ColaEventos.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ReglaConsumidor.Arn

    # --- Columnas (EVA-02): assignment.published -> cola -> Lambda (DLQ tras 5 intentos) ---
    ColaColumnasDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-calificaciones-columnas-dlq
        MessageRetentionPeriod: 1209600

    ColaColumnas:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-calificaciones-columnas
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaColumnasDLQ.Arn
          maxReceiveCount: 5

    ReglaColumnas:
      Type: AWS::Events::Rule
      Properties:
        Name: nubeduca-${sls:stage}-calificaciones-columnas
        EventBusName: ${self:custom.busName}
        EventPattern:
          source: [lms.assessment]
          detail-type: [lms.assessment.assignment.published.v1]
        Targets:
          - Id: cola-columnas
            Arn: !GetAtt ColaColumnas.Arn

    PoliticaColaColumnas:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref ColaColumnas]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ColaColumnas.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ReglaColumnas.Arn

    # --- Notas (EVA-02): submission.graded -> cola -> Lambda (DLQ tras 5 intentos) ---------
    ColaNotasDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-calificaciones-notas-dlq
        MessageRetentionPeriod: 1209600

    ColaNotas:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-calificaciones-notas
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaNotasDLQ.Arn
          maxReceiveCount: 5

    ReglaNotas:
      Type: AWS::Events::Rule
      Properties:
        Name: nubeduca-${sls:stage}-calificaciones-notas
        EventBusName: ${self:custom.busName}
        EventPattern:
          source: [lms.assessment]
          detail-type: [lms.assessment.submission.graded.v1]
        Targets:
          - Id: cola-notas
            Arn: !GetAtt ColaNotas.Arn

    PoliticaColaNotas:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref ColaNotas]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ColaNotas.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ReglaNotas.Arn

    # --- Auditoría (DAT-01): grade.changed -> cola -> Lambda (DLQ tras 5 intentos) -------
    ColaAuditoriaDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-calificaciones-auditoria-dlq
        MessageRetentionPeriod: 1209600

    ColaAuditoria:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-calificaciones-auditoria
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaAuditoriaDLQ.Arn
          maxReceiveCount: 5

    ReglaAuditoria:
      Type: AWS::Events::Rule
      Properties:
        Name: nubeduca-${sls:stage}-calificaciones-auditoria
        EventBusName: ${self:custom.busName}
        EventPattern:
          source: [lms.grading]
          detail-type: [lms.grading.grade.changed.v1]
        Targets:
          - Id: cola-auditoria
            Arn: !GetAtt ColaAuditoria.Arn

    PoliticaColaAuditoria:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref ColaAuditoria]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ColaAuditoria.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ReglaAuditoria.Arn

    # PLT-06: alarma si algún evento termina en una DLQ (falló 5 veces).
    AlarmaDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: nubeduca-${sls:stage}-calificaciones-eventos-dlq
        AlarmDescription: Hay eventos de matrícula que ms-calificaciones no pudo procesar
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt ColaEventosDLQ.QueueName
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    AlarmaAuditoriaDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: nubeduca-${sls:stage}-calificaciones-auditoria-dlq
        AlarmDescription: Hay cambios de nota que la auditoría no pudo registrar
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt ColaAuditoriaDLQ.QueueName
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    AlarmaColumnasDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: nubeduca-${sls:stage}-calificaciones-columnas-dlq
        AlarmDescription: Hay tareas publicadas que no se pudieron agregar al libro de notas
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt ColaColumnasDLQ.QueueName
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    AlarmaNotasDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: nubeduca-${sls:stage}-calificaciones-notas-dlq
        AlarmDescription: Hay calificaciones de entregas que no se pudieron guardar en el libro de notas
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt ColaNotasDLQ.QueueName
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    # URL de la API para el frontend (infra/frontend de nubeduca-backend la lee de aquí).
    ApiUrlParam:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /nubeduca/${sls:stage}/api/calificaciones/url
        Type: String
        Value: !Join ['', ['https://', !Ref ApiGatewayRestApi, '.execute-api.${aws:region}.amazonaws.com/${sls:stage}']]

  Outputs:
    TablaNombre:
      Value: !Ref Tabla
    TablaAuditoria:
      Value: !Ref TablaAuditoria
    ColaAuditoriaUrl:
      Value: !Ref ColaAuditoria
    ColaColumnasUrl:
      Value: !Ref ColaColumnas
    ColaNotasUrl:
      Value: !Ref ColaNotas
    ApiUrl:
      Value: !Join ['', ['https://', !Ref ApiGatewayRestApi, '.execute-api.${aws:region}.amazonaws.com/${sls:stage}']]
